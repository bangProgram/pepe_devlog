<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bangProgram — 개발 회고</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', sans-serif;
            line-height: 1.7; color: #333; background-color: #f8f9fa;
        }
        .container { max-width: 760px; margin: 0 auto; padding: 48px 20px; }
        .hero { text-align: center; margin-bottom: 40px; }
        .hero h1 { font-size: 30px; color: #2563EB; margin-bottom: 10px; }
        .hero p { font-size: 15px; color: #666; }
        .card {
            display: block; background: white; padding: 24px 28px; margin-bottom: 16px;
            border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            text-decoration: none; color: inherit; transition: transform .12s, box-shadow .12s;
        }
        .card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(37,99,235,0.15); }
        .card h3 { font-size: 19px; color: #2563EB; margin-bottom: 6px; }
        .card p { font-size: 14px; color: #555; }
        .card .date { display: block; margin-top: 10px; font-size: 12px; color: #999; }
        .badges {
            display: flex; flex-wrap: wrap; justify-content: center; gap: 20px;
            margin: 0 auto 44px; max-width: 560px;
        }
        .badge { text-align: center; width: 76px; }
        .badge img {
            width: 64px; height: 64px; border-radius: 16px; display: block; margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        .badge span { display: block; margin-top: 8px; font-size: 12px; color: #666; }
        .footer { text-align: center; margin-top: 40px; font-size: 13px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="hero">
            <h1>개발 회고</h1>
            <p>만든 것들과 그 과정의 기록</p>
        </div>
        <div class="badges">
        <!-- BADGE_LIST_START -->
          <figure class="badge">
            <img src="./assets/icons/hangong-icon.png" alt="한손공부 아이콘">
            <span>한손공부</span>
          </figure>
        <!-- BADGE_LIST_END -->
        </div>
        <!-- POST_LIST_START -->
        <a class="card" href="./hangong.html">
          <h3>한손공부 (HanGong)</h3>
          <p>한 손으로 자투리 시간에 외우는 플래시카드 학습 앱</p>
          <span class="date">2026-06-02</span>
        </a>
        <!-- POST_LIST_END -->
        <div class="footer">문의: pepe.dev222@gmail.com</div>
    </div>
</body>
</html>
