<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="description" content="혼자 만들어 운영하는 앱들과, 만들면서 막혔던 과정을 적은 개발 회고입니다.">
<meta property="og:title" content="bangProgram 골목">
<meta property="og:description" content="혼자 만들어 운영하는 앱들과, 만들면서 막혔던 과정을 적은 개발 회고입니다.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#15133a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css">
<style>
  :root {
    --night: #15133a;
    --street: #201d3d;
    --panel: #2a2552;
    --paper: #efe6d2;
    --soft: #d6cfe6;
    --muted: #a59ec4;
    --line: #3a3566;
    --sign: 'Black Han Sans', 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    --body: 'Pretendard', -apple-system, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--street);
    color: var(--paper);
    font-family: var(--body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    word-break: keep-all;
  }
  a { color: inherit; }

  /* 상단 바 */
  .top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px clamp(16px, 4vw, 40px);
    background: var(--night);
  }
  .brand { font-family: var(--sign); font-size: 20px; text-decoration: none; }
  .top nav { display: flex; gap: 20px; font-size: 15px; }
  .top nav a { text-decoration: none; color: var(--muted); }
  .top nav a:hover, .top nav a:focus-visible { color: var(--paper); }

  /* 히어로: 골목 그림 */
  .hero { position: relative; background: var(--night); }
  .intro { padding: 16px clamp(16px, 4vw, 40px) 4px; max-width: 580px; }
  .intro h1 {
    font-family: var(--sign);
    font-weight: 400;
    font-size: clamp(34px, 4.6vw, 56px);
    line-height: 1.1;
    margin: 0 0 10px;
  }
  .intro p { margin: 0; color: var(--soft); font-size: 16px; text-shadow: 0 1px 8px var(--night); }
  @media (min-width: 1000px) {
    .intro { position: absolute; top: 0; left: 0; z-index: 2; padding-top: 34px; }
  }
  .street { overflow-x: auto; overflow-y: hidden; scrollbar-width: none; }
  .street::-webkit-scrollbar { display: none; }
  .street svg { display: block; width: 100%; min-width: 880px; height: auto; }
  .swipe { display: none; }
  @media (max-width: 879px) {
    .swipe { display: block; margin: 0; text-align: center; font-size: 13px; color: var(--muted); padding: 10px 0 0; background: var(--street); }
  }

  /* 그림 속 요소 */
  .star { fill: #fff6dd; animation: twinkle 4s ease-in-out infinite; }
  @keyframes twinkle { 0%, 100% { opacity: .25; } 50% { opacity: 1; } }
  .lit { opacity: 0; transition: opacity .6s ease; }
  .on .lit, .lit.on { opacity: 1; }
  .spill { opacity: 0; transition: opacity .4s ease; }
  .shop.on .spill { opacity: .6; }
  .shop:hover .spill, .shop:focus-visible .spill { opacity: 1; }
  .shop { cursor: pointer; }
  .shop:focus { outline: none; }
  .shop .sign { stroke-width: 2; transition: stroke-width .2s ease; }
  .shop:hover .sign { stroke-width: 4; }
  .shop:focus-visible .sign { stroke: #fff; stroke-width: 4; }
  .signtext { font-family: var(--sign); font-size: 20px; fill: var(--paper); }
  .signtext.dim { fill: #8d86ad; }
  .note { font-family: var(--body); font-size: 14px; font-weight: 700; fill: #3a2f4f; }
  .cat .eyes { animation: blink 6s infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
  .cat .tail { animation: sway 3.2s ease-in-out infinite; transform-box: fill-box; transform-origin: 0% 100%; }
  @keyframes sway { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(10deg); } }

  /* 가게 안내 */
  .shops { max-width: 820px; margin: 0 auto; padding: 64px clamp(16px, 4vw, 40px) 40px; }
  .shops h2 { font-family: var(--sign); font-weight: 400; font-size: 32px; margin: 0 0 6px; }
  .lede { margin: 0 0 36px; color: var(--muted); }
  .shoplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 30px; }
  .row a {
    position: relative;
    display: grid;
    grid-template-columns: 64px 1fr;
    gap: 18px;
    padding: 36px 22px 22px;
    background: var(--panel);
    border-radius: 2px 2px 12px 12px;
    text-decoration: none;
  }
  /* 차양처럼 늘어진 윗변 */
  .row a::before {
    content: '';
    position: absolute;
    left: 0; right: 0; top: 0;
    height: 14px;
    background:
      linear-gradient(var(--c), var(--c)) top / 100% 6px no-repeat,
      radial-gradient(circle at 8px 6px, var(--c) 7.5px, transparent 8px) 0 0 / 16px 14px repeat-x;
  }
  .row a:focus-visible { outline: 2px solid var(--c); outline-offset: 4px; }
  .row img { width: 64px; height: 64px; border-radius: 15px; background: #3a3466; }
  .row h3 { font-family: var(--sign); font-weight: 400; font-size: 26px; line-height: 1.2; margin: 0; }
  .row h3 small { font-family: var(--body); font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 6px; }
  .row p { margin: 6px 0 12px; color: var(--soft); max-width: 60ch; }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 14px; color: var(--muted); }
  .more { color: var(--c); font-weight: 600; }
  .row a:hover .more { text-decoration: underline; text-underline-offset: 3px; }
  .row.empty div {
    border: 2px dashed var(--line);
    border-radius: 12px;
    padding: 22px;
    color: var(--muted);
  }
  .row.empty strong { display: block; color: var(--soft); font-weight: 600; }

  /* 문의 */
  footer {
    max-width: 820px;
    margin: 0 auto;
    padding: 36px clamp(16px, 4vw, 40px) 56px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 15px;
  }
  footer h2 { font-family: var(--sign); font-weight: 400; font-size: 22px; color: var(--paper); margin: 0 0 6px; }
  footer p { margin: 0 0 4px; }
  footer a { color: var(--paper); }

  @media (max-width: 879px) {
    .row a { grid-template-columns: 52px 1fr; gap: 14px; }
    .row img { width: 52px; height: 52px; border-radius: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .star, .cat .eyes, .cat .tail { animation: none; }
    .lit, .spill, .shop .sign { transition: none; }
  }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="./">bangProgram</a>
  <nav aria-label="페이지 이동">

  <ul class="shoplist" id="shoplist"></ul>

  <p><a href="mailto:pepe.dev222@gmail.com">pepe.dev222@gmail.com</a></p>

</footer>

<script>
/* ─────────────────────────────────────────────
   새 앱이 나오면 두 군데를 함께 고칩니다.
   1) 아래 APPS 배열 맨 앞(APP_LIST_START 바로 아래)에 객체 추가
      → 골목 그림과 가게 안내 목록이 함께 늘어납니다.
   2) 위 <noscript> 목록(NOSCRIPT_LIST_START 바로 아래)에 <li> 추가
   목록은 최신 글이 맨 앞입니다.
   ───────────────────────────────────────────── */
const APPS = [
  // APP_LIST_START
  {
    name: '테밀리', en: 'Temily',
    desc: '테니스 클럽 운영을 앱 하나로 해결해요. 일정, 참석 투표, 대진표, 전적을 한곳에서 관리할 수 있어요.',
    date: '2026-06-20', page: 'temily.html', icon: 'assets/icons/temily-icon.png',
    color: '#cfe355', brick: '#6b3f4a'
  },
  {
    name: '파운디', en: 'Found-i',
    desc: '동네에서 잃어버린 물건과 주운 물건을 서로 이어 주는 분실물 서비스예요.',
    date: '2026-06-08', page: 'foundi.html', icon: 'assets/icons/foundi-icon.png',
    color: '#ffad4d', brick: '#4f4374'
  },
  {
    name: '한손공부', en: 'HanGong',
    desc: '자투리 시간에 한 손으로 넘기며 외우는 플래시카드 학습 앱이에요.',
    date: '2026-06-02', page: 'hangong.html', icon: 'assets/icons/hangong-icon.png',
    color: '#7db4ff', brick: '#6a4a36'
  }
  // APP_LIST_END
];

// 아이콘·링크는 이 페이지 기준 상대경로로 씁니다. (도메인이 바뀌어도 그대로 동작)
const BASE = '';

// 새로고침해도 같은 골목이 나오도록 고정 시드 난수 사용
function seeded(seed) {
  return function () {
    seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const R = seeded(7);

const GROUND = 430, SLOT = 230, BW = 200, X0 = 40;
const TOPS = [160, 118, 138, 150, 178, 128, 166, 144];
const SLOTS = Math.max(5, APPS.length + 2);
const W = X0 * 2 + SLOT * SLOTS - (SLOT - BW);
const START = Math.floor((SLOTS - APPS.length) / 2);
const CREAM = '#f3ead8', DARK = '#1b1630';

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function defs() {
  let d = `
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#15133a"/><stop offset=".55" stop-color="#2c2560"/><stop offset="1" stop-color="#57407a"/>
  </linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffe6a8"/><stop offset="1" stop-color="#ffb35a"/>
  </linearGradient>
  <radialGradient id="lampglow"><stop offset="0" stop-color="#ffd88a" stop-opacity=".5"/><stop offset="1" stop-color="#ffd88a" stop-opacity="0"/></radialGradient>
  <radialGradient id="spillg"><stop offset="0" stop-color="#ffcf7a" stop-opacity=".55"/><stop offset="1" stop-color="#ffcf7a" stop-opacity="0"/></radialGradient>
  <radialGradient id="moonglow"><stop offset="0" stop-color="#fff3cf" stop-opacity=".35"/><stop offset="1" stop-color="#fff3cf" stop-opacity="0"/></radialGradient>
  <pattern id="bricks" width="24" height="12" patternUnits="userSpaceOnUse">
    <path d="M0 .5H24M0 6.5H24M6 0V6M18 6V12" stroke="#000" stroke-opacity=".18"/>
  </pattern>
  <pattern id="shutter" width="10" height="8" patternUnits="userSpaceOnUse">
    <rect width="10" height="8" fill="#4a4668"/><rect y="6" width="10" height="2" fill="#36334f"/>
  </pattern>`;
  APPS.forEach((a, k) => {
    const ax = X0 + (START + k) * SLOT - 4;
    d += `<pattern id="aw${k}" x="${ax}" width="26" height="30" patternUnits="userSpaceOnUse">
      <rect width="13" height="30" fill="${a.color}"/><rect x="13" width="13" height="30" fill="${CREAM}"/></pattern>`;
  });
  return `<defs>${d}</defs>`;
}

function skyline() {
  let s = '', x = -10;
  while (x < W) {
    const bw = 50 + R() * 70, bh = 110 + R() * 120, top = GROUND - bh;
    s += `<rect x="${x.toFixed(1)}" y="${top.toFixed(1)}" width="${bw.toFixed(1)}" height="${bh.toFixed(1)}" fill="#2a2554"/>`;
    for (let wy = top + 12; wy < GROUND - 20; wy += 14)
      for (let wx = x + 8; wx < x + bw - 8; wx += 12)
        if (R() < .1) s += `<rect x="${wx.toFixed(1)}" y="${wy.toFixed(1)}" width="3" height="4" fill="#ffd98a" opacity=".5"/>`;
    x += bw - 2;
  }
  return s;
}

function stars() {
  let s = '';
  for (let k = 0; k < 90; k++) {
    s += `<circle class="star" cx="${(R() * W).toFixed(1)}" cy="${(-85 + R() * 230).toFixed(1)}" r="${(.5 + R() * 1.2).toFixed(2)}" style="animation-delay:-${(R() * 4).toFixed(2)}s"/>`;
  }
  return s;
}

function building(i, brick) {
  const x = X0 + i * SLOT, top = TOPS[i % TOPS.length];
  let s = `<rect x="${x}" y="${top}" width="${BW}" height="${GROUND - top}" fill="${brick}"/>
    <rect x="${x}" y="${top}" width="${BW}" height="${GROUND - top}" fill="url(#bricks)"/>
    <rect x="${x - 6}" y="${top - 12}" width="${BW + 12}" height="14" fill="${brick}"/>
    <rect x="${x - 6}" y="${top - 12}" width="${BW + 12}" height="14" fill="#000" opacity=".3"/>`;
  for (let y = top + 26; y + 40 <= 246; y += 56) {
    for (const wx of [x + 34, x + 122]) {
      s += `<rect x="${wx}" y="${y}" width="44" height="40" fill="#221d3e"/>`;
      if (R() < .65) s += `<rect class="lit win" x="${wx}" y="${y}" width="44" height="40" fill="#ffd27a"/>`;
      s += `<path d="M${wx + 22} ${y}V${y + 40}M${wx} ${y + 20}H${wx + 44}" stroke="${DARK}" stroke-width="3"/>
        <rect x="${wx - 3}" y="${y + 40}" width="50" height="4" fill="${DARK}"/>`;
    }
  }
  return s;
}

function shop(i, a, k) {
  const x = X0 + i * SLOT, cx = x + BW / 2, ax = x - 4, aw = BW + 8;
  let scallops = '';
  for (let n = 0; n < 16; n++)
    scallops += `<circle cx="${ax + 6.5 + n * 13}" cy="328" r="6.5" fill="${n % 2 ? CREAM : a.color}"/>`;
  let goods = '';
  [[x + 24, 360], [x + 46, 356], [x + 72, 362], [x + 96, 358]].forEach(([gx, gy], n) => {
    goods += `<rect x="${gx}" y="${gy}" width="${14 + (n % 2) * 6}" height="${374 - gy}" rx="2" fill="${a.color}" opacity=".85"/>`;
  });
  [[x + 30, 392], [x + 62, 390], [x + 92, 393]].forEach(([gx, gy]) => {
    goods += `<rect x="${gx}" y="${gy}" width="16" height="${404 - gy}" rx="2" fill="#8a4b3c" opacity=".7"/>`;
  });
  return `<a class="shop" href="${BASE + a.page}" aria-label="${esc(a.name)} 개발 회고 보기">
    <ellipse class="spill" cx="${cx}" cy="452" rx="140" ry="22" fill="url(#spillg)"/>
    <rect class="sign" x="${x + 18}" y="252" width="164" height="40" rx="6" fill="#231d3f" stroke="${a.color}"/>
    <clipPath id="ic${k}"><rect x="${x + 26}" y="257" width="30" height="30" rx="7"/></clipPath>
    <image href="${BASE + a.icon}" x="${x + 26}" y="257" width="30" height="30" clip-path="url(#ic${k})" preserveAspectRatio="xMidYMid slice"/>
    <text class="signtext" x="${x + 64}" y="279">${esc(a.name)}</text>
    <rect x="${ax}" y="328" width="${aw}" height="12" fill="#000" opacity=".25"/>
    <rect x="${ax}" y="298" width="${aw}" height="30" fill="url(#aw${k})"/>
    ${scallops}
    <rect x="${x + 14}" y="342" width="112" height="74" fill="#2a2445"/>
    <g class="lit"><rect x="${x + 14}" y="342" width="112" height="74" fill="url(#glass)"/>
      <path d="M${x + 14} 375H${x + 126}M${x + 14} 405H${x + 126}" stroke="#7a4a20" stroke-opacity=".45" stroke-width="2"/>
      ${goods}</g>
    <rect x="${x + 14}" y="342" width="112" height="74" fill="none" stroke="${DARK}" stroke-width="4"/>
    <rect x="${x + 10}" y="416" width="120" height="14" fill="${DARK}" opacity=".7"/>
    <rect x="${x + 138}" y="340" width="46" height="90" fill="#2a1f3c" stroke="${DARK}" stroke-width="3"/>
    <rect x="${x + 146}" y="350" width="30" height="26" fill="#2a2445"/>
    <rect class="lit" x="${x + 146}" y="350" width="30" height="26" fill="#ffd27a"/>
    <circle cx="${x + 176}" cy="390" r="2.5" fill="#e8c27a"/>
    <rect x="${x + 132}" y="428" width="58" height="4" fill="${DARK}"/>
  </a>`;
}

function emptyShop(i) {
  const x = X0 + i * SLOT, cx = x + BW / 2;
  return `<rect x="${x + 18}" y="252" width="164" height="40" rx="6" fill="#2c2748" stroke="#4a4570" stroke-width="2"/>
    <text class="signtext dim" x="${cx}" y="279" text-anchor="middle">빈 가게</text>
    <rect x="${x + 8}" y="318" width="184" height="12" fill="${DARK}"/>
    <rect x="${x + 12}" y="330" width="176" height="100" fill="url(#shutter)"/>
    <g transform="rotate(-4 ${cx} 372)">
      <rect x="${cx - 36}" y="355" width="72" height="34" fill="#efe6d2"/>
      <text class="note" x="${cx}" y="377" text-anchor="middle">곧 오픈</text>
    </g>`;
}

function lamp(x) {
  return `<g class="lamp">
    <circle class="lit" cx="${x}" cy="304" r="72" fill="url(#lampglow)"/>
    <rect x="${x - 3}" y="304" width="6" height="126" fill="${DARK}"/>
    <rect x="${x - 11}" y="292" width="22" height="14" rx="3" fill="${DARK}"/>
    <rect class="lit" x="${x - 7}" y="296" width="14" height="8" rx="2" fill="#ffe0a0"/>
    <rect x="${x - 8}" y="428" width="16" height="4" fill="${DARK}"/>
  </g>`;
}

function cat(x, y) {
  const c = '#14122a';
  return `<g class="cat" transform="translate(${x} ${y})">
    <path class="tail" d="M10 0C26 -2 30 -14 22 -26" stroke="${c}" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="-12" rx="13" ry="13" fill="${c}"/>
    <circle cx="0" cy="-30" r="10" fill="${c}"/>
    <path d="M-9 -34L-7 -46L-1 -38ZM9 -34L7 -46L1 -38Z" fill="${c}"/>
    <g class="eyes"><ellipse cx="-4" cy="-31" rx="2" ry="2.4" fill="#ffd34d"/><ellipse cx="4" cy="-31" rx="2" ry="2.4" fill="#ffd34d"/></g>
  </g>`;
}

function ground() {
  let tiles = '';
  for (let x = 0; x < W; x += 40) tiles += `M${x} 430V470`;
  return `<rect x="0" y="430" width="${W}" height="40" fill="#3b3563"/>
    <path d="${tiles}" stroke="#000" stroke-opacity=".15"/>
    <rect x="0" y="470" width="${W}" height="5" fill="#4a4473"/>
    <rect x="0" y="475" width="${W}" height="45" fill="#201d3d"/>
    <line x1="0" y1="498" x2="${W}" y2="498" stroke="#4a4473" stroke-width="3" stroke-dasharray="30 26"/>`;
}

function buildScene() {
  const svg = document.getElementById('scene');
  svg.setAttribute('viewBox', `0 -90 ${W} 610`);
  let s = defs();
  s += `<rect x="0" y="-90" width="${W}" height="520" fill="url(#sky)"/>`;
  s += stars();
  s += `<circle cx="${W - 130}" cy="-20" r="90" fill="url(#moonglow)"/><circle cx="${W - 130}" cy="-20" r="26" fill="#fff3cf"/>`;
  s += skyline();
  s += ground();
  const brickFor = i => ['#3d3a5e', '#45405f', '#3f3a58'][i % 3];
  for (let i = 0; i < SLOTS; i++) {
    const k = i - START;
    s += building(i, k >= 0 && k < APPS.length ? APPS[k].brick : brickFor(i));
  }
  for (let i = 0; i < SLOTS; i++) {
    const k = i - START;
    s += (k >= 0 && k < APPS.length) ? shop(i, APPS[k], k) : emptyShop(i);
  }
  for (let j = 0; j < SLOTS - 1; j++) s += lamp(X0 + BW + 15 + j * SLOT);
  const catSlot = START + Math.min(1, APPS.length - 1);
  s += cat(X0 + catSlot * SLOT + 150, TOPS[catSlot % TOPS.length] - 12);
  svg.innerHTML = s;
}

function buildList() {
  const fmt = d => d.replace(/-/g, '.');
  const list = document.getElementById('shoplist');
  list.innerHTML = APPS.map(a => `
    <li class="row" style="--c:${a.color}">
      <a href="${BASE + a.page}">
        <img src="${BASE + a.icon}" alt="" width="64" height="64" loading="lazy">
        <div>
          <h3>${esc(a.name)}<small>${esc(a.en)}</small></h3>
          <p>${esc(a.desc)}</p>
          <div class="meta"><span class="more">개발 회고 읽기</span><time datetime="${a.date}">${fmt(a.date)} 작성</time></div>
        </div>
      </a>
    </li>`).join('') + `
    <li class="row empty"><div><strong>다음 가게 자리</strong>새 앱이 나오면 이 골목에 가게가 하나 더 생겨요.</div></li>`;
}

function lightUp() {
  const svg = document.getElementById('scene');
  const lamps = [...svg.querySelectorAll('.lamp')];
  const shops = [...svg.querySelectorAll('.shop')];
  const wins = [...svg.querySelectorAll('.win')];
  const on = el => el.classList.add('on');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    [...lamps, ...shops, ...wins].forEach(on);
    return;
  }
  const r = seeded(11);
  lamps.forEach((l, n) => setTimeout(() => on(l), 300 + n * 140));
  shops.forEach((s, n) => setTimeout(() => on(s), 1000 + n * 380));
  wins.forEach(w => setTimeout(() => on(w), 1300 + r() * 1700));
}

buildScene();
buildList();
const street = document.querySelector('.street');
street.scrollLeft = (street.scrollWidth - street.clientWidth) / 2;
lightUp();
</script>
</body>
</html>
